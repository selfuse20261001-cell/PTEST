<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1033">
<title>點歌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 字型不擋畫面：連不到 Google 也會立刻顯示，改用系統字型 -->
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --room: #1B1033; --panel: #2A1B4D; --line: #3D2C66; --neon: #FF4FA3; --amber: #FFC24B;
    --text: #F5EEFF; --muted: #A99BC8;
    --round: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--room); color: var(--text); font-family: var(--body); font-size: 15px;
    padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--room);
    padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; }
  .top h1 { font-family: var(--round); font-weight: 400; font-size: 26px; color: var(--neon); }
  .me { color: var(--muted); font-size: 14px; }
  .me b { color: var(--amber); font-weight: 700; }

  nav { display: flex; gap: 22px; margin-top: 10px; border-bottom: 1px solid var(--line); }
  nav button { padding: 10px 0; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--text); border-color: var(--neon); font-weight: 700; }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 99px;
    background: var(--neon); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }

  main { padding: 14px 16px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; }
  .search button { background: var(--neon); color: #fff; border-radius: 12px; padding: 0 18px; font-weight: 700; }
  .modes { display: flex; gap: 8px; margin: 10px 0 4px; overflow-x: auto; }
  .modes button { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .modes button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 14px 0; }

  .song { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .song img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: var(--panel); }
  .song .t { font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song .c { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .acts button { font-size: 13px; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .acts .go { background: var(--neon); border-color: var(--neon); color: #fff; font-weight: 700; }
  .acts .fav-on { color: var(--amber); border-color: var(--amber); }
  .pos { font-family: var(--round); color: var(--amber); font-size: 13px; }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 2px; color: var(--muted); font-size: 13px; }
  .section-head button { color: var(--neon); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; line-height: 1.8; }

  /* 底部遙控器 */
  #remote { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel);
    border-top: 2px solid var(--neon); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .np { display: flex; align-items: center; gap: 10px; }
  .np .t { flex: 1; min-width: 0; font-family: var(--round); font-size: 16px; color: var(--amber);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .by { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .prog { height: 4px; background: var(--line); border-radius: 2px; margin: 10px 0; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--neon); transition: width 1s linear; }
  .ctrl { display: flex; align-items: center; gap: 10px; }
  .ctrl button { padding: 9px 14px; border-radius: 10px; background: var(--room); border: 1px solid var(--line); font-size: 14px; }
  .ctrl #toggle { background: var(--neon); border-color: var(--neon); color: #fff; font-weight: 700; min-width: 72px; }
  .ctrl input[type=range] { flex: 1; min-width: 60px; accent-color: var(--neon); }

  #toast { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top)); z-index: 20;
    background: var(--amber); color: var(--room); font-weight: 700; padding: 12px 14px; border-radius: 12px;
    opacity: 0; transform: translateY(-8px); transition: .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #toast, .prog i { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>點歌</h1>
    <button class="me" id="me">我是 <b id="me-name"></b>　更改</button>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="search" aria-selected="true">找歌</button>
    <button role="tab" data-tab="queue" aria-selected="false">已點<span class="count" id="qcount">0</span></button>
    <button role="tab" data-tab="fav" aria-selected="false">最愛</button>
  </nav>
</header>

<main>
  <section id="tab-search">
    <form class="search" id="search-form">
      <input id="q" type="search" placeholder="歌名或歌手，也可以貼 YouTube 連結" autocomplete="off" enterkeyhint="search">
      <button type="submit">搜尋</button>
    </form>
    <div class="modes" id="modes">
      <button type="button" data-mode="KTV" aria-pressed="true">KTV</button>
      <button type="button" data-mode="伴唱" aria-pressed="false">伴唱</button>
      <button type="button" data-mode="導唱" aria-pressed="false">導唱</button>
      <button type="button" data-mode="" aria-pressed="false">原曲 MV</button>
    </div>
    <p class="hint" id="search-hint">搜尋時會自動加上「KTV」，比較容易找到有歌詞字幕的版本。<br>「插播」會把歌排到下一首。</p>
    <div id="results"></div>
  </section>

  <section id="tab-queue" class="hidden">
    <div id="queue"></div>
    <div id="history"></div>
  </section>

  <section id="tab-fav" class="hidden">
    <div id="favs"></div>
  </section>
</main>

<div id="remote">
  <div class="np"><span class="t" id="np-title">還沒有歌</span><span class="by" id="np-by"></span></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="ctrl">
    <button id="replay" aria-label="從頭唱">重唱</button>
    <button id="toggle">暫停</button>
    <button id="skip">切歌</button>
    <input type="range" id="vol" min="0" max="100" aria-label="音量">
  </div>
</div>

<div id="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let name = store.get('ktv-name', '');
let favs = store.get('ktv-favs', []);
let mode = 'KTV', state = null, lastResults = [];

function askName() {
  const n = prompt('你的名字（會顯示在電視上）', name || '');
  if (n !== null && n.trim()) { name = n.trim().slice(0, 12); store.set('ktv-name', name); }
  $('me-name').textContent = name || '來賓';
}
$('me').onclick = askName;
$('me-name').textContent = name || '來賓';
if (!name) setTimeout(askName, 300);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// 分頁
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['search', 'queue', 'fav'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  if (b.dataset.tab === 'fav') renderFavs();
  window.scrollTo(0, 0);
});

// 搜尋模式
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('search-hint').firstChild.textContent = mode
    ? `搜尋時會自動加上「${mode}」，比較容易找到有歌詞字幕的版本。` : '搜尋原曲和官方 MV，通常沒有伴唱字幕。';
  if ($('q').value.trim()) search();
});

const ytId = s => (s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || [])[1];

async function search() {
  const raw = $('q').value.trim();
  if (!raw) return;
  $('q').blur();
  const id = ytId(raw);
  $('results').innerHTML = '<p class="empty">搜尋中…</p>';
  try {
    if (id) {
      const r = await fetch('/api/video/' + id); const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      lastResults = [j];
    } else {
      const q = mode && !raw.includes(mode) ? `${raw} ${mode}` : raw;
      const r = await fetch('/api/search?q=' + encodeURIComponent(q)); const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      lastResults = j.items;
    }
    renderResults();
  } catch (e) {
    $('results').innerHTML = `<p class="empty">${esc(e.message || '搜尋失敗')}</p>`;
  }
}
$('search-form').onsubmit = e => { e.preventDefault(); search(); };

const isFav = v => favs.some(f => f.videoId === v);
function songRow(s, extra = '') {
  return `<div class="song">
    <img src="${esc(s.thumb)}" alt="" loading="lazy">
    <div>
      <div class="t">${esc(s.title)}</div>
      <div class="c">${esc(s.channel)}</div>
      <div class="acts">${extra}</div>
    </div></div>`;
}
const pickActs = (s, i, src) => `
  <button class="go" data-act="add" data-src="${src}" data-i="${i}">點歌</button>
  <button data-act="next" data-src="${src}" data-i="${i}">插播</button>
  <button data-act="fav" data-src="${src}" data-i="${i}" class="${isFav(s.videoId) ? 'fav-on' : ''}">${isFav(s.videoId) ? '★ 已收藏' : '☆ 收藏'}</button>`;

function renderResults() {
  $('results').innerHTML = lastResults.length
    ? lastResults.map((s, i) => songRow(s, pickActs(s, i, 'r'))).join('')
    : '<p class="empty">找不到。換個關鍵字，或切換成「伴唱」「原曲 MV」再試。</p>';
}

function renderFavs() {
  $('favs').innerHTML = favs.length
    ? favs.map((s, i) => songRow(s, pickActs(s, i, 'f'))).join('')
    : '<p class="empty">還沒有收藏。<br>在搜尋結果按「☆ 收藏」，常唱的歌下次就不用再找。</p>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = Number(b.dataset.id);
  const list = b.dataset.src === 'f' ? favs : b.dataset.src === 'h' ? (state?.history || []) : lastResults;
  const s = list[Number(b.dataset.i)];
  if (act === 'add' || act === 'next') {
    socket.emit('add', { ...s, by: name || '來賓', next: act === 'next' });
  }
  if (act === 'fav') {
    favs = isFav(s.videoId) ? favs.filter(f => f.videoId !== s.videoId)
      : [{ videoId: s.videoId, title: s.title, channel: s.channel, thumb: s.thumb }, ...favs];
    store.set('ktv-favs', favs);
    renderResults(); renderFavs();
  }
  if (act === 'top') socket.emit('top', id);
  if (act === 'remove') socket.emit('remove', id);
});

function renderQueue() {
  const q = state.queue;
  $('qcount').textContent = q.length;
  $('queue').innerHTML = q.length
    ? `<div class="section-head"><span>${q.length} 首排隊中</span><button id="clear">全部清除</button></div>` +
      q.map((s, i) => songRow(s, `
        <span class="pos">第 ${i + 1} 首｜${esc(s.by)}</span>
        ${i > 0 ? `<button data-act="top" data-id="${s.id}">排到下一首</button>` : ''}
        <button data-act="remove" data-id="${s.id}">刪除</button>`)).join('')
    : '<p class="empty">排隊中沒有歌。<br>到「找歌」點一首吧。</p>';
  const h = state.history.slice(0, 10);
  $('history').innerHTML = h.length
    ? `<div class="section-head"><span>剛唱過</span></div>` +
      h.map((s, i) => songRow(s, `<button class="go" data-act="add" data-src="h" data-i="${i}">再點一次</button>`)).join('')
    : '';
  const c = $('clear');
  if (c) c.onclick = () => { if (confirm('清除所有排隊中的歌？')) socket.emit('clear'); };
}

socket.on('state', s => {
  state = s;
  renderQueue();
  $('np-title').textContent = s.current ? s.current.title : '還沒有歌';
  $('np-by').textContent = s.current ? s.current.by : '';
  $('toggle').textContent = s.playing ? '暫停' : '播放';
  if (document.activeElement !== $('vol')) $('vol').value = s.volume;
  if (!s.current) $('prog').style.width = 0;
});
socket.on('progress', p => { $('prog').style.width = p.d ? (p.t / p.d * 100) + '%' : 0; });
socket.on('toast', toast);
socket.on('disconnect', () => toast('和電視斷線了，重新連線中…'));

$('toggle').onclick = () => socket.emit('toggle');
$('replay').onclick = () => socket.emit('replay');
$('skip').onclick = () => socket.emit('skip');
let vt; $('vol').oninput = e => { clearTimeout(vt); vt = setTimeout(() => socket.emit('volume', e.target.value), 120); };
</script>
</body>
</html>
