<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>台股模擬帳戶</title><style>
:root{--bg:#f6f7f5;--fg:#1d2422;--mute:#5f6b67;--line:#dfe3e0;--up:#c8322b;--dn:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e6ebe8;--mute:#9aa5a1;--line:#2e3532;--up:#f06a5f;--dn:#4ade80}}
body{background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Noto Sans TC","PingFang TC",sans-serif;margin:0}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 8px}a{color:inherit}
.sub{color:var(--mute);font-size:13px}.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:400;font-size:12px;border-bottom:2px solid var(--line);padding:4px 8px 4px 0}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.key b{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
svg text{fill:var(--mute);font-size:10px}svg{color:var(--fg);touch-action:none}
.chip{display:inline-block;border:2px solid;border-radius:99px;padding:0 10px;font-size:13px;cursor:pointer;user-select:none}.chip.off{opacity:.35}
.tip{position:absolute;top:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;white-space:pre;pointer-events:none}
#sum tr:hover{background:var(--line)}
</style></head><body><main><h1>台股 150 萬模擬帳戶｜10/21</h1><p class="sub">每個策略各自一個 150 萬帳戶，從 10/08 開始。點下方標籤可隱藏／顯示該策略。</p><div id="key" class="key"></div><div style="position:relative"><svg id="chart" viewBox="0 0 640 240" width="100%" role="img" aria-label="各策略淨值走勢"></svg><div id="tip" class="tip" hidden></div></div><h2>總資產</h2><div class="tw"><table id="sum"><tr><th>策略</th><th>總資產</th><th>報酬</th></tr></table></div><h2>持股 <span id="posnote" class="sub"></span></h2><div class="tw"><table id="pos"><tr><th>策略</th><th>股票</th><th>股數</th><th>均價</th><th>報酬</th></tr></table></div><script>
const COLORS = ["#c8322b", "#0f5e5a", "#b26b00", "#4f6bd8", "#8a2a24", "#15803d", "#7a4fd8", "#5f6b67"], START = 1500000;
const fmt = v => Math.round(v).toLocaleString(), pc = x => (x > 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
const cls = x => x > 0 ? "up" : x < 0 ? "dn" : "";
function parse(t) {
  const [head, ...lines] = t.trim().split(/\r?\n/);
  const cols = head.split(",");
  return lines.map(l => Object.fromEntries(l.split(",").map((v, i) => [cols[i], v])));
}
function el(tag, attrs = {}, text) {
  const e = document.createElementNS(tag === "div" ? "http://www.w3.org/1999/xhtml" : "http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
Promise.all(["eq.csv", "pos.csv"].map(f => fetch(f).then(r => r.text()))).then(([eqT, posT]) => {
  const eq = parse(eqT), pos = parse(posT);
  const names = [...new Set(eq.map(r => r.strategy))], dates = [...new Set(eq.map(r => r.date))].sort();
  const val = {}; eq.forEach(r => (val[r.strategy] ??= {})[r.date] = +r.value);
  const on = new Set(names); let picked = null;
  const svg = document.getElementById("chart"), tip = document.getElementById("tip");
  const keyBox = document.getElementById("key"), sumT = document.getElementById("sum"), posT2 = document.getElementById("pos");
  function draw() {
    svg.replaceChildren();
    const W = 640, H = 240, P = 28, shown = names.filter(n => on.has(n));
    const vs = shown.flatMap(n => Object.values(val[n]));
    if (!vs.length) return;
    const lo = Math.min(...vs), hi = Math.max(...vs);
    const x = i => P + i * (W - 2 * P) / Math.max(dates.length - 1, 1);
    const y = v => H - P - (v - lo) / ((hi - lo) || 1) * (H - 2 * P);
    svg.append(el("line", {x1: P, x2: W - P, y1: y(START), y2: y(START), stroke: "currentColor", "stroke-opacity": .25, "stroke-dasharray": "3 3"}));
    svg.append(el("text", {x: P, y: 12}, fmt(hi)), el("text", {x: P, y: H - 8}, fmt(lo)));
    svg.append(el("text", {x: W - P, y: H - 8, "text-anchor": "end"}, dates.at(-1)));
    shown.forEach(n => {
      const pts = dates.map((d, i) => val[n][d] === undefined ? null : x(i).toFixed(1) + "," + y(val[n][d]).toFixed(1)).filter(Boolean);
      svg.append(el("polyline", {points: pts.join(" "), fill: "none", stroke: COLORS[names.indexOf(n) % COLORS.length],
        "stroke-width": picked === n ? 3 : 1.6, "stroke-opacity": picked && picked !== n ? .3 : 1}));
    });
    const guide = el("line", {y1: P, y2: H - P, stroke: "currentColor", "stroke-opacity": 0});
    svg.append(guide);
    svg.onpointermove = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(dates.length - 1, Math.round((px - P) / ((W - 2 * P) / Math.max(dates.length - 1, 1)))));
      guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i)); guide.setAttribute("stroke-opacity", .4);
      tip.replaceChildren(el("div", {}, dates[i]));
      shown.map(n => [n, val[n][dates[i]]]).filter(([, v]) => v !== undefined).sort((a, b) => b[1] - a[1])
        .forEach(([n, v]) => { const d = el("div", {}, n + "  " + fmt(v) + "  " + pc(v / START - 1)); d.className = cls(v - START); tip.append(d); });
      tip.hidden = false;
      tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - tip.offsetWidth) + "px";
    };
    svg.onpointerleave = () => { tip.hidden = true; guide.setAttribute("stroke-opacity", 0); };
  }
  function tables() {
    sumT.querySelectorAll("tr:not(:first-child)").forEach(r => r.remove());
    names.map(n => [n, val[n][Object.keys(val[n]).sort().at(-1)]]).sort((a, b) => b[1] - a[1]).forEach(([n, v]) => {
      const tr = sumT.insertRow(); tr.style.cursor = "pointer"; if (picked === n) tr.style.fontWeight = 700;
      tr.insertCell().textContent = n; tr.insertCell().textContent = fmt(v);
      const c = tr.insertCell(); c.textContent = pc(v / START - 1); c.className = cls(v - START);
      tr.onclick = () => { picked = picked === n ? null : n; draw(); tables(); };
    });
    posT2.querySelectorAll("tr:not(:first-child)").forEach(r => r.remove());
    pos.filter(r => !picked || r.strategy === picked).forEach(r => {
      const tr = posT2.insertRow();
      [r.strategy, r.stock, (+r.shares).toLocaleString(), r.avg_cost].forEach(t => tr.insertCell().textContent = t);
      const c = tr.insertCell(); if (r.ret) { c.textContent = pc(+r.ret); c.className = cls(+r.ret); }
    });
    document.getElementById("posnote").textContent = picked ? "（" + picked + "，再點一次看全部）" : "（點上表的策略只看該策略）";
  }
  names.forEach((n, i) => {
    const b = el("div"); b.className = "chip"; b.style.borderColor = COLORS[i % COLORS.length]; b.textContent = n;
    b.onclick = () => { on.has(n) ? on.delete(n) : on.add(n); b.classList.toggle("off"); draw(); };
    keyBox.append(b);
  });
  draw(); tables();
}).catch(e => { document.getElementById("key").textContent = "資料讀取失敗：" + e; });
</script><p class="sub">僅供研究，非投資建議。<a href="https://selfuse20261001-cell.github.io/PTEST/">回首頁</a></p></main></body></html>
